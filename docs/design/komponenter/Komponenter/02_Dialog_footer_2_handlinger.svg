    <line x1="0" y1="265" x2="572" y2="265" stroke="#8F7B69" stroke-width="1.0"/>
    <g id="handling-1" role="button">
      <g id="avbryt-symbol" transform="translate(96.0 294)" fill="none" stroke="#C7BAA9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="9"/>
        <path d="M7 7l6 6 M13 7l-6 6"/>
      </g>
      <text x="153.0" y="315" fill="#C7BAA9" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Avbryt</text>
    </g>
    <g id="handling-2" role="button">
      <g id="ikon-lagre" transform="translate(386.0 292) scale(1.00000)" stroke="#272421" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <g opacity="1">
          <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
