<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="572" height="345" viewBox="0 0 572 345">
  <title>Dialog med 2 footerhandlinger</title>
  <desc>Utsnitt fra Ny_sangbok: header, skillelinje, innholdsfelt og integrert 80px footer. Kun sekundære handlinger med lik vekting skilles vertikalt.</desc>
  <defs>
    <clipPath id="dialogklipp">
      <rect x="0" y="0" width="572" height="345" rx="24"/>
    </clipPath>
  </defs>
  <g id="dialogkropp" clip-path="url(#dialogklipp)">
    <rect x="0" y="0" width="572" height="345" fill="#322E2A" rx="0"/>
    <text x="32" y="56" fill="#F4EDE3" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Eksempel</text>
    <line x1="32" y1="75" x2="540" y2="75" stroke="#8F7B69" stroke-width="0.85"/>
    <text x="32" y="116" fill="#F4EDE3" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">Navn</text>
    <rect x="32" y="133" width="508" height="57" fill="#272421" stroke="#8F7B69" stroke-width="0.85" rx="13"/>
    <text x="52" y="170" fill="#C7BAA9" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">Lorem ipsum</text>
    <rect x="0.0" y="265" width="286.03" height="80" fill="#322E2A" rx="0"/>
