name: Validate
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Validate the same immutable source SHA that Pages will build, not the PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          # The workflow's helper also supports older open PR heads without these scripts.
          ref: ${{ github.workflow_sha }}
          path: .ci-infra
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run check
      - name: Build validated source once per required channel
        env:
          APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_PR: ${{ github.event.pull_request.number || '' }}
        run: node .ci-infra/scripts/build-validated.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-test
          overwrite: true
          path: release/test/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: validated-production
          overwrite: true
          path: release/production/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
